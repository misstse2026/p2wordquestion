<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>神奇魔法藥水屋：加減判斷大冒險</title>
  <style>
    :root {
      --primary-color: #7d5fff;
      --add-color: #05c46b;
      --sub-color: #ff3f34;
      --bg-dark: #1e1335;
      --text-color: #2d3436;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      background: radial-gradient(circle at 50% 30%, #3c2a68 0%, #150d2a 100%);
      color: #fff;
    }

    /* Floating Background Particles & Symbols */
    .bg-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0.25;
      animation: floatUp 12s infinite linear;
      font-weight: bold;
      color: #ffd32a;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.3; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Main Container */
    .game-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      max-width: 1024px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 2;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .title-box h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #ffd32a;
      text-shadow: 0 2px 8px rgba(255, 211, 42, 0.5);
    }

    /* Potion Shelf */
    .shelf-container {
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.35);
      padding: 8px 14px;
      border-radius: 16px;
      border-bottom: 4px solid #7d5fff;
    }

    .potion-slot {
      width: 36px;
      height: 36px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: grayscale(100%) opacity(0.25);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .potion-slot.unlocked {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.25) rotate(5deg);
      animation: potionBounce 0.6s ease;
    }

    @keyframes potionBounce {
      0%, 100% { transform: scale(1.25); }
      50% { transform: scale(1.5) rotate(-10deg); }
    }

    .stats-badge {
      display: flex;
      gap: 12px;
    }

    .badge {
      background: #ffd32a;
      color: #1e1335;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.05rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .badge-streak {
      background: #ff5e57;
      color: #fff;
    }

    /* Question Card Area */
    .question-area {
      margin-top: 16px;
      background: #ffffff;
      color: var(--text-color);
      border-radius: 28px;
      padding: 22px 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 4px solid #7d5fff;
    }

    .question-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .question-tag {
      background: #ff3f34;
      color: white;
      padding: 6px 16px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
    }

    .tts-btn {
      background: linear-gradient(135deg, #0fbcf9, #4bcffa);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(15, 188, 249, 0.4);
      transition: transform 0.15s;
    }

    .tts-btn:active {
      transform: scale(0.95);
    }

    .question-text {
      font-size: 1.55rem;
      line-height: 1.6;
      font-weight: 700;
      color: #2d3436;
      text-align: center;
      margin: 8px 0;
    }

    /* Cauldron Zone */
    .cauldron-zone {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      margin-top: 10px;
      padding: 0 10px;
    }

    .cauldron {
      width: 44%;
      max-width: 290px;
      height: 250px;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      touch-action: none;
      overflow: hidden;
    }

    .cauldron:active, .cauldron.drag-over {
      transform: scale(1.06);
    }

    .cauldron-add {
      background: linear-gradient(135deg, #05c46b 0%, #0e7040 100%);
      border: 5px solid #05c46b;
    }

    .cauldron-sub {
      background: linear-gradient(135deg, #ff3f34 0%, #a81c15 100%);
      border: 5px solid #ff3f34;
    }

    /* Bubbles Animation in Cauldrons */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: bubbleRise 3s infinite ease-in;
      pointer-events: none;
    }

    @keyframes bubbleRise {
      0% { transform: translateY(100px) scale(0.3); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }

    .cauldron-icon {
      font-size: 4.5rem;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .cauldron-title {
      font-size: 1.9rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }

    .cauldron-subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Draggable Crystal Center Piece */
    .crystal-draggable {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 105px;
      height: 105px;
      background: radial-gradient(circle at 30% 30%, #ef5777, #575fcf);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 30px #ef5777, inset 0 0 15px rgba(255,255,255,0.8);
      cursor: grab;
      touch-action: none;
      z-index: 10;
      animation: crystalPulse 2s infinite alternate;
    }

    @keyframes crystalPulse {
      0% { box-shadow: 0 0 20px #ef5777, inset 0 0 10px rgba(255,255,255,0.6); }
      100% { box-shadow: 0 0 40px #ffd32a, inset 0 0 20px rgba(255,255,255,0.9); }
    }

    .crystal-draggable:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* Explanation Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      color: #2d3436;
      border-radius: 32px;
      width: 90%;
      max-width: 580px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 6px solid #ffd32a;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-status {
      font-size: 4rem;
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 2rem;
      font-weight: 900;
      color: #1e1335;
    }

    .modal-explain {
      font-size: 1.3rem;
      line-height: 1.6;
      color: #2d3436;
      background: #f1f2f6;
      padding: 18px 22px;
      border-radius: 20px;
      margin: 18px 0;
      text-align: left;
      border-left: 6px solid #7d5fff;
    }

    .modal-btn {
      background: linear-gradient(135deg, #7d5fff, #575fcf);
      color: white;
      border: none;
      padding: 16px 42px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(125, 95, 255, 0.4);
      margin-top: 10px;
      transition: transform 0.15s;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    /* Canvas Confetti Layer */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <!-- Floating background particles -->
  <div id="bgParticles"></div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <div class="game-container">
    <!-- Header Bar -->
    <div class="header-bar">
      <div class="title-box">
        <h1>🧙‍♂️ 魔法藥水屋</h1>
      </div>

      <!-- Infinite Potion Shelf -->
      <div class="shelf-container" id="potionShelf">
        <div class="potion-slot">🧪</div>
        <div class="potion-slot">🧪</div>
        <div class="potion-slot">🧪</div>
        <div class="potion-slot">🧪</div>
        <div class="potion-slot">🧪</div>
        <div class="potion-slot">🧪</div>
      </div>

      <div class="stats-badge">
        <div class="badge" id="scoreText">答對: 0</div>
        <div class="badge badge-streak" id="streakText">🔥 0</div>
      </div>
    </div>

    <!-- Question Area -->
    <div class="question-area">
      <div class="question-header">
        <span class="question-tag" id="questionNum">第 1 題</span>
        <button class="tts-btn" id="ttsBtn" onclick="speakQuestion()">
          🔊 廣東話朗讀
        </button>
      </div>
      <div class="question-text" id="questionText">正在準備魔法題目...</div>
    </div>

    <!-- Cauldron Interactive Area -->
    <div class="cauldron-zone" id="cauldronZone">
      <!-- Addition Cauldron -->
      <div class="cauldron cauldron-add" id="cauldronAdd" onclick="selectAnswer('+')">
        <div class="bubble" style="left: 20%; width: 12px; height: 12px; animation-delay: 0s;"></div>
        <div class="bubble" style="left: 60%; width: 18px; height: 18px; animation-delay: 1s;"></div>
        <div class="cauldron-icon">➕</div>
        <div class="cauldron-title">加法大鍋</div>
        <div class="cauldron-subtitle">數量變多 / 合併 / 增加</div>
      </div>

      <!-- Draggable Crystal Ball -->
      <div class="crystal-draggable" id="crystalBall">🔮</div>

      <!-- Subtraction Cauldron -->
      <div class="cauldron cauldron-sub" id="cauldronSub" onclick="selectAnswer('-')">
        <div class="bubble" style="left: 30%; width: 14px; height: 14px; animation-delay: 0.5s;"></div>
        <div class="bubble" style="left: 75%; width: 16px; height: 16px; animation-delay: 1.5s;"></div>
        <div class="cauldron-icon">➖</div>
        <div class="cauldron-title">減法大鍋</div>
        <div class="cauldron-subtitle">拿走 / 剩下 / 比較差距</div>
      </div>
    </div>
  </div>

  <!-- Explanation Modal Popup -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <div class="modal-status" id="modalStatusIcon">🎉</div>
      <div class="modal-title" id="modalTitle">回答正確！</div>
      <div class="modal-explain" id="modalExplain">解題說明...</div>
      <button class="modal-btn" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>

  <script>
    // Procedural Generator for Infinite Standard Written Chinese Word Problems
    const nameList = ["小明", "小紅", "小華", "小強", "小麗", "軒軒", "欣欣", "樂樂"];
    const itemList = ["蘋果", "積木", "鉛筆", "貼紙", "糖果", "公仔", "卡牌", "草莓"];

    function generateRandomQuestion() {
      const name = nameList[Math.floor(Math.random() * nameList.length)];
      const item = itemList[Math.floor(Math.random() * itemList.length)];
      const numA = Math.floor(Math.random() * 8) + 4; // 4 ~ 11
      const numB = Math.floor(Math.random() * 3) + 2; // 2 ~ 4

      const templates = [
        {
          type: "+",
          text: `${name}原本有 ${numA} 個${item}，媽媽又給了他 ${numB} 個，${name}現在一共有多少個${item}？`,
          explanation: `💡 媽媽「又給了他」${item}，${item}的數量<b>變多了</b>！所以要用 <b>加法 (➕)</b> 把數量合起來。`
        },
        {
          type: "-",
          text: `桌上有 ${numA} 個${item}，${name}吃了 ${numB} 個，還剩下多少個${item}？`,
          explanation: `💡 ${item}被「吃了」，桌上的${item}數量<b>變少了</b>！所以要用 <b>減法 (➖)</b> 計算剩下的數量。`
        },
        {
          type: "-",
          text: `${name}有 ${numA} 個${item}，小華比${name}少 ${numB} 個。小華有多少個${item}？`,
          explanation: `💡 小華比${name}「少」，要求比較少的那個人，數量要<b>變小</b>，所以要用 <b>減法 (➖)</b>。`
        },
        {
          type: "+",
          text: `盒子裡有一些${item}，拿走 ${numB} 個後，還剩下 ${numA} 個。盒子裡原本有多少個${item}？`,
          explanation: `💡 要求「原本」的數量，要把拿走的 ${numB} 個${item}<b>放回去</b>與剩下的 ${numA} 個合起來，數量會<b>變多</b>！所以要用 <b>加法 (➕)</b>。`
        },
        {
          type: "-",
          text: `小強有 ${numA} 個${item}，弟弟有 ${numB} 個${item}。小強比弟弟多多少個${item}？`,
          explanation: `💡 題目要「比較兩人的差距」（多多少），求差距要用大數減小數，所以要用 <b>減法 (➖)</b>。`
        }
      ];

      return templates[Math.floor(Math.random() * templates.length)];
    }

    let currentQuestion = null;
    let totalCorrect = 0;
    let streak = 0;
    let questionCounter = 1;
    let synth = window.speechSynthesis;

    // Elements
    const questionTextEl = document.getElementById('questionText');
    const questionNumEl = document.getElementById('questionNum');
    const scoreTextEl = document.getElementById('scoreText');
    const streakTextEl = document.getElementById('streakText');
    const modalOverlay = document.getElementById('resultModal');
    const modalStatusIcon = document.getElementById('modalStatusIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalExplain = document.getElementById('modalExplain');
    const crystal = document.getElementById('crystalBall');
    const cauldronAdd = document.getElementById('cauldronAdd');
    const cauldronSub = document.getElementById('cauldronSub');

    // Create Background Particles
    function initBgParticles() {
      const container = document.getElementById('bgParticles');
      const symbols = ['➕', '➖', '✨', '⭐', '🧪'];
      for(let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'bg-particle';
        p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
        container.appendChild(p);
      }
    }

    // Audio Generator
    function playAudioFx(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch(e) {}
    }

    // Cantonese TTS Speech Synthesis
    function speakQuestion() {
      if (!synth || !currentQuestion) return;
      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(currentQuestion.text);
      utterance.rate = 0.85;

      const voices = synth.getVoices();
      const cantoneseVoice = voices.find(v => 
        v.lang.includes('zh-HK') || 
        v.lang.includes('yue') || 
        v.lang.includes('zh-YUE') ||
        v.name.includes('Sin-Ji') ||
        v.name.includes('Ting-Ting')
      );

      if (cantoneseVoice) utterance.voice = cantoneseVoice;
      utterance.lang = 'zh-HK';

      synth.speak(utterance);
    }

    function loadNextQuestion() {
      currentQuestion = generateRandomQuestion();
      questionNumEl.textContent = `第 ${questionCounter} 題`;
      questionTextEl.textContent = currentQuestion.text;
      resetCrystal();
      setTimeout(() => { speakQuestion(); }, 350);
    }

    function resetCrystal() {
      crystal.style.left = '50%';
      crystal.style.top = '50%';
      crystal.style.transform = 'translate(-50%, -50%)';
    }

    function selectAnswer(userChoice) {
      synth.cancel();
      const isCorrect = (userChoice === currentQuestion.type);

      if (isCorrect) {
        totalCorrect++;
        streak++;
        scoreTextEl.textContent = `答對: ${totalCorrect}`;
        streakTextEl.textContent = `🔥 ${streak}`;
        playAudioFx('correct');
        fireConfetti();

        // Unlock Potion in Shelf
        const slots = document.querySelectorAll('.potion-slot');
        const slotIdx = (totalCorrect - 1) % slots.length;
        slots[slotIdx].classList.add('unlocked');

        modalStatusIcon.textContent = '🎉';
        modalTitle.textContent = '太棒了！答對了！';
      } else {
        streak = 0;
        streakTextEl.textContent = `🔥 ${streak}`;
        playAudioFx('wrong');

        modalStatusIcon.textContent = '🤔';
        modalTitle.textContent = '再仔細想想看喔！';
      }

      modalExplain.innerHTML = currentQuestion.explanation;
      modalOverlay.classList.add('active');
    }

    function nextQuestion() {
      modalOverlay.classList.remove('active');
      questionCounter++;
      loadNextQuestion();
    }

    // Simple Particle Confetti
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ffd32a', '#ff4d4d', '#05c46b', '#0fbcf9', '#ef5777'];

      for (let i = 0; i < 50; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          life: 60
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.life > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        if (active) requestAnimationFrame(render);
      }
      render();
    }

    // Touch & Mouse Drag Controls
    let isDragging = false;

    function handleStart(e) {
      isDragging = true;
    }

    function handleMove(e) {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches ? e.touches[0] : e;
      const zoneRect = document.getElementById('cauldronZone').getBoundingClientRect();

      let x = touch.clientX - zoneRect.left;
      let y = touch.clientY - zoneRect.top;

      crystal.style.left = `${x}px`;
      crystal.style.top = `${y}px`;

      const addRect = cauldronAdd.getBoundingClientRect();
      const subRect = cauldronSub.getBoundingClientRect();

      if (touch.clientX >= addRect.left && touch.clientX <= addRect.right &&
          touch.clientY >= addRect.top && touch.clientY <= addRect.bottom) {
        cauldronAdd.classList.add('drag-over');
      } else {
        cauldronAdd.classList.remove('drag-over');
      }

      if (touch.clientX >= subRect.left && touch.clientX <= subRect.right &&
          touch.clientY >= subRect.top && touch.clientY <= subRect.bottom) {
        cauldronSub.classList.add('drag-over');
      } else {
        cauldronSub.classList.remove('drag-over');
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;

      const addRect = cauldronAdd.getBoundingClientRect();
      const subRect = cauldronSub.getBoundingClientRect();
      const crystalRect = crystal.getBoundingClientRect();
      const centerX = crystalRect.left + crystalRect.width / 2;
      const centerY = crystalRect.top + crystalRect.height / 2;

      cauldronAdd.classList.remove('drag-over');
      cauldronSub.classList.remove('drag-over');

      if (centerX >= addRect.left && centerX <= addRect.right &&
          centerY >= addRect.top && centerY <= addRect.bottom) {
        selectAnswer('+');
      } else if (centerX >= subRect.left && centerX <= subRect.right &&
                 centerY >= subRect.top && centerY <= subRect.bottom) {
        selectAnswer('-');
      } else {
        resetCrystal();
      }
    }

    crystal.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    crystal.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    window.onload = () => {
      initBgParticles();
      loadNextQuestion();
    };
  </script>
</body>
</html>
